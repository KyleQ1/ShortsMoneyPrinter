[project]
name = "shorts-money-printer"
version = "0.1.0"
description = "Local-first AI video remix engine: turn any short into an AI-generated version."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "yt-dlp>=2025.1.1",        # download the source video from a URL
    "edge-tts>=7.0",           # free default TTS voice (no key)
    "faster-whisper>=1.0",     # word-level caption timing (CPU int8 by default)
]

[project.optional-dependencies]
dev = ["ruff>=0.7", "pytest>=8.3", "mypy>=1.13"]
seedance = ["replicate>=1.0", "fal-client>=0.5"]   # optional AI video gen (BYO key)

[project.scripts]
smp = "app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
