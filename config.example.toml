# ShortsMoneyPrinter config — copy to config.toml and fill in.
# Everything is pluggable; leave a section blank to disable that provider.

[app]
output_dir = "./storage/output"
work_dir   = "./storage/work"
watermark  = true          # cloud trial forces this on; self-host can disable

[llm]
# Used for script analysis + original script generation.
# provider: openai | ollama | deepseek | gemini | azure | openai_compatible
provider = "openai"
api_key  = ""
base_url = ""              # e.g. http://localhost:11434/v1 for Ollama
model    = "gpt-4o-mini"

[video_gen]
# AI video generation for remix blocks. BYO Replicate key for live cloud runs.
# provider: none | seedance
provider        = "seedance"
api_key         = ""
endpoint        = "replicate" # replicate | fal (legacy smoke test)
max_ai_seconds  = 6        # cap AI-gen seconds per video to protect COGS; rest = stock

[stock]
# Free bulk footage. Falls back across sources so a job never returns zero clips.
pexels_api_key  = ""
pixabay_api_key = ""

[tts]
# provider: edge | azure | elevenlabs
provider = "edge"          # edge-tts is free, no key
api_key  = ""
voice    = "en-US-AriaNeural"

[subtitles]
# provider: whisper | edge
provider    = "whisper"    # faster-whisper, GPU-accelerated; word-level karaoke captions
model_size  = "large-v3"

[discovery]
# Self-host only: auto-find candidate videos in a niche. Runs on YOUR machine/accounts.
enabled = false
niches  = []               # e.g. ["stoicism", "personal finance"]

# Social publishing is configured at runtime via OAuth (BYO accounts), not here.
